name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Cancel superseded runs on the same ref (but never cancel tag/release runs).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Unit tests (cargo) + end-to-end tests (Deno against the release binary).
  # ---------------------------------------------------------------------------
  test:
    name: Unit + e2e tests (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # Build deps mirror the Dockerfile. clang/llc are also needed by the
      # clang eBPF compiler mode exercised by the e2e suite.
      - name: Install build & toolchain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang llvm libclang-dev pkg-config
          # Put the unversioned clang/llc/opt from the LLVM bindir on PATH so the
          # `clang`/`llc` invocations in pack.rs resolve.
          echo "$(llvm-config --bindir)" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Build release binary (used by the e2e suite)
        run: cargo build --release --locked

      - name: Unit tests
        run: cargo test --locked

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The end-to-end suite compares zeroserve against stock Caddy. Pin a known
      # Caddy commit so behavioral comparisons stay stable across Caddy releases
      # (e.g. precompressed serving changed status via caddyserver/caddy#7040 /
      # #7250). Without this the comparison tests silently skip (no caddy on PATH).
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install pinned Caddy (for the e2e comparison suite)
        env:
          CADDY_COMMIT: d3986f824d2e82310405d5ca520d61f3e2e701c9
        run: |
          go install "github.com/caddyserver/caddy/v2/cmd/caddy@${CADDY_COMMIT}"
          echo "CADDY_BIN=$(go env GOPATH)/bin/caddy" >> "$GITHUB_ENV"

      # Pebble is Let's Encrypt's test ACME server; the e2e suite uses it (with
      # pebble-challtestsrv as a mock DNS resolver) to exercise automatic
      # TLS-ALPN-01 certificate issuance. Pin a known-good release.
      - name: Install Pebble (for the ACME e2e test)
        env:
          PEBBLE_VERSION: v2.10.1
        run: |
          go install "github.com/letsencrypt/pebble/v2/cmd/pebble@${PEBBLE_VERSION}"
          go install "github.com/letsencrypt/pebble/v2/cmd/pebble-challtestsrv@${PEBBLE_VERSION}"
          echo "PEBBLE_BIN=$(go env GOPATH)/bin/pebble" >> "$GITHUB_ENV"
          echo "PEBBLE_CHALLTESTSRV_BIN=$(go env GOPATH)/bin/pebble-challtestsrv" >> "$GITHUB_ENV"

      # The server isolates itself with unprivileged user namespaces by default.
      # Ubuntu 24.04 runners restrict these via AppArmor; relax it so the server
      # can start during the e2e tests (otherwise `--disable-ns-isolation` would
      # be required, which the tests do not pass).
      - name: Allow unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Verify scripting toolchain is available
        run: |
          clang --version
          llc --version

      - name: End-to-end tests (tcc)
        working-directory: testing
        env:
          ZEROSERVE_EBPF_COMPILER: tcc
        run: deno test -A --parallel

      - name: End-to-end tests (clang)
        working-directory: testing
        env:
          ZEROSERVE_EBPF_COMPILER: clang
        run: deno test -A --parallel

  # ---------------------------------------------------------------------------
  # OpenBSD amd64: build, unit tests, and the Deno e2e suite inside a
  # KVM-accelerated VM (GitHub has no native OpenBSD runners). Exercises the
  # non-Linux port surface: monoio legacy/kqueue driver, hupwatch kqueue
  # thread, EVFILT_SIGNAL reload path, tempfile-backed site loading.
  # Package availability verified against the 7.9 amd64 package index.
  # ---------------------------------------------------------------------------
  test-openbsd:
    name: Unit + e2e tests (OpenBSD amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # Cross-compile the pinned Caddy + Pebble (pure Go) for OpenBSD on the
      # host and ship the binaries into the VM with the workspace rsync.
      # Building them inside the VM needs ~2 GB of Go module/build cache in
      # /root, which overflows the VM's small root partition. Same pins as the
      # Linux job: behavioral comparisons must not drift.
      - name: Cross-compile pinned Caddy + Pebble for OpenBSD
        env:
          CADDY_COMMIT: d3986f824d2e82310405d5ca520d61f3e2e701c9
          PEBBLE_VERSION: v2.10.1
          GOOS: openbsd
          GOARCH: amd64
        run: |
          go install "github.com/caddyserver/caddy/v2/cmd/caddy@${CADDY_COMMIT}"
          go install "github.com/letsencrypt/pebble/v2/cmd/pebble@${PEBBLE_VERSION}"
          go install "github.com/letsencrypt/pebble/v2/cmd/pebble-challtestsrv@${PEBBLE_VERSION}"
          mkdir -p .obsd-tools
          cp "$(go env GOPATH)/bin/openbsd_amd64/"* .obsd-tools/
          chmod +x .obsd-tools/*

      - name: Build and test in OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          release: "7.9"
          arch: x86_64
          usesh: true
          mem: 8192
          # rsync the workspace in; nothing needs syncing back (no artifacts).
          sync: rsync
          copyback: false
          # rust (1.94.1): the crate itself. gmake: build.rs builds the bundled
          #   BPF tinycc with GNU make. cmake: boring-sys builds BoringSSL.
          #   llvm%19: clang/llc for the clang eBPF compiler mode plus
          #   libclang.so for bindgen (base-system clang ships neither llc nor
          #   libclang). deno + node: the e2e suite. git: boring-sys runs
          #   `git init` while assembling its BoringSSL source tree. unzip--
          #   (default flavor): build.rs extracts the tinycc archive with it.
          #   openssl%3.5: the ACME tests use `openssl x509 -copy_extensions`,
          #   which base LibreSSL does not support.
          #
          # The e2e suite must NOT run as root: permission-denial tests chmod
          # directories to 0o000 and expect 403s, and root bypasses file
          # permissions entirely. Give the builder user a login class with
          # enough fds and address space for the server under test.
          prepare: |
            pkg_add -I rust gmake cmake llvm%19 deno node git unzip-- openssl%3.5
            cat >> /etc/login.conf <<'EOF'
            builder:\
                :datasize=infinity:\
                :maxproc-max=1024:\
                :maxproc-cur=1024:\
                :openfiles-max=16384:\
                :openfiles-cur=16384:\
                :tc=default:
            EOF
            useradd -m -L builder -s /bin/ksh builder
            # The ACME tests invoke `openssl`; expose the ports OpenSSL 3 (its
            # binary is installed under an eopenssl* name) ahead of base
            # LibreSSL on PATH.
            mkdir -p /home/tools
            for c in eopenssl35 eopenssl; do
              if [ -x "/usr/local/bin/$c" ]; then
                ln -sf "/usr/local/bin/$c" /home/tools/openssl
                break
              fi
            done
            test -x /home/tools/openssl
          run: |
            set -e
            df -h
            export CARGO_TERM_COLOR=always
            # The llvm package installs under a versioned prefix
            # (/usr/local/llvm19/{bin,lib}); put clang/llc on PATH and point
            # bindgen's clang-sys at libclang.so explicitly.
            export PATH="/usr/local/llvm19/bin:$PATH"
            export LIBCLANG_PATH=/usr/local/llvm19/lib
            # Keep the big caches off the small /root partition: the synced
            # workspace (and thus the cargo target dir) lives under /home,
            # which holds the bulk of the disk — put the cargo registry and
            # deno cache there too.
            export CARGO_HOME=/home/cargo
            export DENO_DIR=/home/deno-cache
            # rustc needs more address space than some default login classes
            # allow; lift the soft limit to the hard limit.
            ulimit -d "$(ulimit -Hd)" || true

            WS="$(pwd)"

            cargo build --release --locked
            cargo test --locked

            # Run the e2e suite as the unprivileged builder user (root would
            # defeat the permission-denial tests). V8's JIT pages violate
            # OpenBSD's W^X; deno must run jitless.
            cat > /tmp/e2e.sh <<EOF
            set -e
            export PATH="/home/tools:/usr/local/llvm19/bin:\$PATH"
            # clang/llc in the versioned llvm prefix need their shared libs
            # (libclang-cpp, libLLVM) which live outside the default ld.so
            # search path.
            export LD_LIBRARY_PATH=/usr/local/llvm19/lib
            export DENO_DIR=/home/deno-cache
            export DENO_V8_FLAGS=--jitless
            export CADDY_BIN="$WS/.obsd-tools/caddy"
            export PEBBLE_BIN="$WS/.obsd-tools/pebble"
            export PEBBLE_CHALLTESTSRV_BIN="$WS/.obsd-tools/pebble-challtestsrv"
            cd "$WS/testing"
            ZEROSERVE_EBPF_COMPILER=tcc deno test -A --parallel
            ZEROSERVE_EBPF_COMPILER=clang deno test -A --parallel
            EOF
            mkdir -p /home/deno-cache
            chown -R builder "$WS" /home/deno-cache /tmp/e2e.sh
            # OpenBSD su: -c selects a login CLASS, not a command; passing the
            # script path as a shell argument runs it under builder's ksh.
            su builder /tmp/e2e.sh
            df -h

  # ---------------------------------------------------------------------------
  # Small routing benchmark matrix used as a performance smoke test. This keeps
  # runtime bounded while covering the optimized N=8 / 2-thread / 10ms
  # preemption shape across servers, compilers, protocols, and proxy mode.
  # ---------------------------------------------------------------------------
  benchmark:
    name: Routing benchmarks (n=8, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install build, benchmark, and toolchain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang llvm libclang-dev pkg-config \
            nginx openssl wrk
          echo "$(llvm-config --bindir)" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: benchmark-${{ matrix.arch }}

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install pinned Caddy
        env:
          CADDY_COMMIT: d3986f824d2e82310405d5ca520d61f3e2e701c9
        run: |
          go install "github.com/caddyserver/caddy/v2/cmd/caddy@${CADDY_COMMIT}"
          echo "CADDY_BIN=$(go env GOPATH)/bin/caddy" >> "$GITHUB_ENV"

      - name: Allow unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Add benchmark hostnames
        run: |
          echo "127.0.0.1 host0000.bench host0007.bench nomatch.bench" | sudo tee -a /etc/hosts

      - name: Build release binary
        run: cargo build --release --locked

      - name: Routing benchmark matrix
        run: |
          python3 benchmark/routing/ci_matrix.py \
            --duration 3 \
            --runs 1 \
            --caddy-binary "$CADDY_BIN" \
            --nginx-binary /usr/sbin/nginx

  # ---------------------------------------------------------------------------
  # Release binaries for linux/amd64 and linux/arm64, linked against glibc 2.31
  # via cargo-zigbuild. Runs on every push/PR to catch build breaks; artifacts
  # are consumed by the `release` job on tags.
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            zig_target: x86_64-unknown-linux-gnu.2.31
            asset: zeroserve-x86_64-linux
          - target: aarch64-unknown-linux-gnu
            zig_target: aarch64-unknown-linux-gnu.2.31
            asset: zeroserve-aarch64-linux
    steps:
      - uses: actions/checkout@v4

      # Host build scripts still run natively (bindgen needs libclang, boring-sys
      # needs cmake); zig handles the cross C/C++ compilation and linking.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang llvm libclang-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0

      # Pin cargo-zigbuild: 0.23.0 regressed glibc-suffixed target triples
      # (e.g. x86_64-unknown-linux-gnu.2.31), making zig reject the triple with
      # "version '.2.31' ... is invalid". Stay on the last known-good release.
      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.22.3

      - name: Build
        run: cargo zigbuild --release --locked --target ${{ matrix.zig_target }}

      # cargo-zigbuild strips the glibc suffix from the output directory.
      - name: Stage artifact
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/zeroserve" "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Multi-arch Docker image assembled from the prebuilt binaries (Dockerfile.dist
  # just copies them in — no recompilation). Pushed to GHCR on main pushes
  # (`latest` plus the full commit SHA) and on tags (semver); pull requests build
  # the image but skip the push, so the assembly is still exercised on every PR.
  # ---------------------------------------------------------------------------
  docker:
    name: Docker image
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # buildx COPYs dist/<arch>/zeroserve via TARGETARCH (amd64 | arm64).
      - name: Stage binaries by arch
        run: |
          mkdir -p dist/amd64 dist/arm64
          mv dist/zeroserve-x86_64-linux  dist/amd64/zeroserve
          mv dist/zeroserve-aarch64-linux dist/arm64/zeroserve
          chmod +x dist/amd64/zeroserve dist/arm64/zeroserve

      # Emulation is only needed for the `apt-get install ca-certificates` RUN in
      # the arm64 stage; the binary itself is already built natively.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dist
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ---------------------------------------------------------------------------
  # Publish a GitHub Release with the built binaries when a tag is pushed.
  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
