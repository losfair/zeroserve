[package]
name = "zeroserve"
version = "0.2.12-alpha.10"
edition = "2024"

[profile.release]
panic = "abort"

[build-dependencies]
cc = "1"
lalrpop = "0.23"

[dependencies]
lalrpop-util = "0.23"
arc-swap = "1"
chrono = "0.4"
# OpenBSD-capable async-ebpf (coroutine JIT + libclang discovery).
async-ebpf = "0.4.0-alpha.6"
base64ct = { version = "1", features = ["alloc"] }
dashmap = "6"
blake3 = "1"
bytes = "1"
faster-hex = "0.10"
futures = "0.3"
h2 = "0.4"
# Base monoio features used on all platforms (legacy/kqueue on BSD).
# Fork adds OpenBSD support for the legacy driver.
monoio = { git = "https://github.com/losfair/monoio", rev = "c17852f233275d6849580f7630f09eda68e33973", default-features = false, features = ["async-cancel", "bytes", "legacy", "poll-io", "utils", "sync", "macros", "mkdirat", "unlinkat", "renameat"] }
monoio-compat = { git = "https://github.com/losfair/monoio", rev = "c17852f233275d6849580f7630f09eda68e33973" }
boring = "5"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
argon2 = "0.5.3"
bcrypt = "0.19.1"
hmac = "0.12"
http = "1"
idna = "1"
libc = "0.2"
mini-moka = { version = "0.10", default-features = false }
nix = { version = "0.30", features = ["event", "fs"] }
parking_lot = "0.12"
rand = "0.8"
rayon = "1.11"
rlimit = "0.10"
scopeguard = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = { version = "0.5", features = ["all"] }
struson = { version = "0.6", features = ["serde"] }
ulid = "1"
url = "2"
moka = { version = "0.12", features = ["future"] }
tar = "0.4"
chacha20poly1305 = "0.10"
serde_vici = "0.1.5"
flate2 = "1.1.9"
zstd = "0.13.3"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
caps = "0.5"
io-uring = "0.6"
# Unioned with the base monoio dependency so Linux also gets io_uring.
monoio = { git = "https://github.com/losfair/monoio", rev = "c17852f233275d6849580f7630f09eda68e33973", default-features = false, features = ["iouring"] }
nix = { version = "0.30", features = ["mount", "event", "fs"] }
